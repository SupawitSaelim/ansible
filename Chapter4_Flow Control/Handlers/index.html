<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Hat Page</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      font-family: 'Arial', sans-serif;
    }

    h1 {
      font-size: 4rem;
      color: #cc0000;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      animation: pulse 2s infinite, colorShift 5s infinite alternate;
      transition: transform 0.3s ease;
    }

    h1:hover {
      transform: scale(1.2);
    }

    /* Pulse effect */
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    /* Color shift effect */
    @keyframes colorShift {
      0% { color: #cc0000; }
      50% { color: #ff4d4d; }
      100% { color: #cc0000; }
    }
  </style>
</head>
<body>
  <h1>Red Hat</h1>
</body>
</html>
